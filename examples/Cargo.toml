[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone example apps for compose (kept out of backend crates)"
publish = false
# example 手动声明（story 入口位于 story/ 子目录），关闭自动发现避免重复目标。
autoexamples = false

# Android 最终 .so：链接 compose 的 android_main + examples 的 compose_create_app_root。
# 平台宿主入口归引擎层 compose::platform::android，本 lib 只提供应用根注入实现。
[lib]
name = "story_android"
path = "story/android_lib.rs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "story"
path = "story/main.rs"

[features]
default = []
# 透传给 compose 的异步执行器 feature：cargo run -p examples --example story --features tokio
tokio = ["compose/tokio"]
async-std = ["compose/async-std"]

[dependencies]
compose = { package = "rustmp", path = "../crates/compose" }
compose-material = { package = "rustmp-material", path = "../crates/compose-material" }
# story 演示用：程序生成一张测试 PNG 字节，喂给 `Image` 控件走完整「解码 → 上传 → 绘制」管线。
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
